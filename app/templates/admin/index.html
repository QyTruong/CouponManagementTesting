{% extends 'admin/master.html' %}

{% block body %}

{% if current_user.is_authenticated and current_user.user_role.name == 'ADMIN' %}
<h1 class="text-center text-info mt-1">Chào mừng {{ current_user.name }} đến với trang quản trị</h1>

{% else %}
<h1 class="text-success text-center">Đăng nhập quản trị</h1>

<form method="post" action="/login?next=/admin">
    <div class="form-floating mb-3 mt-3">
        <input type="text" class="form-control" id="username" placeholder="Tên đăng nhập" name="username" required />
        <label for="username">Tên đăng nhập</label>
    </div>

    <div class="form-floating mb-3 mt-3">
        <input type="password" class="form-control" id="password" placeholder="Mật khẩu" name="password" required />
        <label for="password">Mật khẩu</label>
    </div>

    <div class="form-floating mt-3 mb-3">
        <button type="submit" class="btn btn-info">Đăng nhập</button>
    </div>
</form>


{% endif %}

{% endblock %}
