{% extends 'layout/base.html' %}

{% block title %}Chi tiết sản phẩm{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center text-success mb-4">Chi tiết sản phẩm</h1>

    {% if err_msg %}
        <div class="alert alert-danger text-center">{{ err_msg }}</div>
    {% endif %}

    <div class="card bg-success shadow-lg p-4 border-0 rounded-4">
        <div class="row g-4 align-items-center">

            <div class="col-md-6 text-center">
                <img src="{{ product.image }}" alt="{{ product.name }}" style="max-height: 350px; object-fit: cover;">
            </div>

            <div class="col-md-6">
                <h2 class="fw-bold text-white">{{ product.name }}</h2>

                <h3 class="text-white fw-bold mt-4">
                    {{ "{:,.0f}".format(product.price) }} VND
                </h3>

                <button class="btn btn-danger mt-4 px-4 py-2 rounded-pill shadow-sm"
                        style="transition: 0.3s;"
                        onmouseover="this.style.transform='scale(1.05)'"
                        onmouseout="this.style.transform='scale(1)'"
                        onclick="addToCart({{ product.id }}, '{{ product.name }}', {{ product.price }})">
                    Đặt hàng
                </button>
            </div>

        </div>
    </div>
</div>


{% endblock %}
